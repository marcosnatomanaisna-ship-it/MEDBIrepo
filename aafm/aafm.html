/* ===================== CAPTURA DE ERROS VISÍVEL ===================== */
function showFatalError(msg) {
  document.getElementById("app").innerHTML = `
    <div style="max-width:520px;margin:60px auto;padding:20px;font-family:sans-serif;background:#F2DFD7;color:#A83C2E;border-radius:8px;line-height:1.5">

      <p style="font-family:monospace;font-size:13px;word-break:break-all;margin-top:10px">${String(msg)}</p>
      <p style="font-size:13px;margin-top:14px;color:#5A5040">Tira um print deste ecrã e envia para diagnóstico.</p>
    </div>`;
}
window.addEventListener("error", (e) => showFatalError(e.message + " (linha " + e.lineno + ")"));
window.addEventListener("unhandledrejection", (e) => showFatalError("Promise rejeitada: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

if (typeof window.supabase === "undefined") {
  showFatalError("A biblioteca do Supabase não carregou (sem internet ou script bloqueado).");

}

  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===================== HELPERS ===================== */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function fmtDate(iso) {
  if (!iso) return "—";
  const [y,m,d] = iso.split("-");
  return (y && m && d) ? `${d}/${m}/${y}` : iso;
}
function yearOf(iso) {
  const y = parseInt((iso||"").split("-")[0], 10);
  return Number.isFinite(y) ? y : new Date().getFullYear();
}
function uid() {
  return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
}
function computeNumero(tipo, direcao, ano) {
  if (direcao === "Recebido") {
    const n = state.docs.filter(d => d.direcao === "Recebido" && d.ano === ano).length + 1;
    return `Entrada ${String(n).padStart(2,"0")}/${ano}`;
  }
  const n = state.docs.filter(d => d.direcao === "Emitido" && d.tipo === tipo && d.ano === ano).length + 1;
  return `${TIPO_ABREV[tipo] || "DOC"} ${String(n).padStart(2,"0")}/${ano}`;
}
function csvCell(v) {
  const s = String(v ?? "");
  return /[",\n;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
}
function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add("show"), 10);
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3000);
}

/* ===================== AUTH ===================== */
let wasLoggedIn = null;

supabase.auth.getSession().then(({ data }) => {
  state.session = data.session;
  wasLoggedIn = !!state.session;
  renderRoot();
  if (state.session) loadDocs();
});

supabase.auth.onAuthStateChange((event, session) => {
  state.session = session;
  if (event === "PASSWORD_RECOVERY") { renderRoot(); openRecoveryModal(); return; }
  const isLoggedIn = !!session;
  if (isLoggedIn !== wasLoggedIn) {
    wasLoggedIn = isLoggedIn;
    renderRoot();
    if (isLoggedIn) loadDocs();
  }
});

async function login(email, password) {
  return supabase.auth.signInWithPassword({ email, password });
}
async function logout() {
  await supabase.auth.signOut();
}

/* ===================== DATA ===================== */
async function loadDocs() {
  state.loadingDocs = true;
  renderList();
  const { data, error } = await supabase.from("documentos").select("*").order("data", { ascending: false });
  state.loadingDocs = false;
  if (!error) state.docs = data || [];
  renderList();
}

async function addDocument(form, file) {
  const ano = yearOf(form.data);
  const numero = computeNumero(form.tipo, form.direcao, ano);
  const path = `${ano}/${uid()}-${file.name}`;

  const { error: uploadErr } = await supabase.storage.from(BUCKET).upload(path, file);
  if (uploadErr) throw new Error("Falha ao enviar o ficheiro: " + uploadErr.message);

  const row = {
    numero, tipo: form.tipo, direcao: form.direcao, data: form.data, ano,
    assunto: form.assunto.trim(), entidade: form.entidade.trim(),
    referencia_entidade: form.direcao === "Recebido" ? (form.referenciaEntidade || "").trim() : "",
    departamento: form.departamento, notas: form.notas || "",
    ficheiro_nome: file.name, ficheiro_tipo: file.type, ficheiro_path: path,
  };
  const { error: insertErr } = await supabase.from("documentos").insert(row);
  if (insertErr) {
    await supabase.storage.from(BUCKET).remove([path]);
    throw new Error("Falha ao guardar o registo: " + insertErr.message);
  }
  await loadDocs();
  toast(`Documento registado: ${numero}`);
}

async function deleteDocument(doc) {
  if (doc.ficheiro_path) await supabase.storage.from(BUCKET).remove([doc.ficheiro_path]);
  const { error } = await supabase.from("documentos").delete().eq("id", doc.id);
  if (error) { toast("Não foi possível remover o documento."); return; }
  state.docs = state.docs.filter(d => d.id !== doc.id);
  renderList();
  toast("Documento removido do registo.");
}

async function getSignedUrl(path) {
  const { data, error } = await supabase.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error) throw new Error("Não foi possível obter o ficheiro.");
  return data.signedUrl;
}

function buildCSV() {
  const header = ["Número","Tipo","Direção","Data","Ano","Assunto","Entidade","Referência da entidade","Departamento"];
  const rows = state.docs.map(d => [d.numero, d.tipo, d.direcao, fmtDate(d.data), d.ano, d.assunto, d.entidade, d.referencia_entidade || "", d.departamento]);
  return [header, ...rows].map(r => r.map(csvCell).join(",")).join("\n");
}

  const overlay = document.createElement("div");

        <button type="submit" class="btn-primary">Guardar</button>
      </form>

  document.body.appendChild(overlay);
  document.getElementById("recoverForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const errBox = document.getElementById("recoverError");

    overlay.remove();

/* ===================== RENDER: LIST ===================== */
function renderList() {
  const listEl = document.getElementById("docList");
  const countEl = document.getElementById("countBadge");
  if (!listEl) return;

  if (countEl) countEl.textContent = `${state.docs.length} documento${state.docs.length === 1 ? "" : "s"}`;

  const anoSelect = document.getElementById("filterAno");
  if (anoSelect) {
    const anos = Array.from(new Set([new Date().getFullYear(), ...state.docs.map(d=>d.ano)])).sort((a,b)=>b-a);
    const current = state.filters.ano;
    anoSelect.innerHTML = `<option value="">Todos os anos</option>` + anos.map(a=>`<option value="${a}" ${String(a)===current?"selected":""}>${a}</option>`).join("");
  }

  const hasFilters = state.filters.q || state.filters.tipo || state.filters.direcao || state.filters.departamento || state.filters.ano;
  const clearBtn = document.getElementById("clearFiltersBtn");
  if (clearBtn) clearBtn.style.display = hasFilters ? "inline-block" : "none";

  if (state.loadingDocs) {
    listEl.innerHTML = `<div class="loading-row">A carregar o registo...</div>`;
    return;
  }

  const filtered = state.docs.filter(d => {
    if (state.filters.tipo && d.tipo !== state.filters.tipo) return false;
    if (state.filters.direcao && d.direcao !== state.filters.direcao) return false;
    if (state.filters.departamento && d.departamento !== state.filters.departamento) return false;
    if (state.filters.ano && String(d.ano) !== state.filters.ano) return false;
    if (state.filters.q) {
      const q = state.filters.q.toLowerCase();
      const hay = `${d.numero} ${d.assunto} ${d.entidade} ${d.referencia_entidade||""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => (b.data||"").localeCompare(a.data||"") || b.numero.localeCompare(a.numero));

  if (!filtered.length) {
    listEl.innerHTML = `
      <div class="empty-state">
        <p class="empty-title">${state.docs.length === 0 ? "Ainda não há documentos registados" : "Nenhum documento corresponde aos filtros"}</p>
        <p class="muted">${state.docs.length === 0 ? "Regista a primeira ata, comunicado ou ofício para começar o livro digital." : "Ajusta a pesquisa ou limpa os filtros."}</p>
      </div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(d => { (grouped[d.ano] = grouped[d.ano] || []).push(d); });
  const years = Object.keys(grouped).map(Number).sort((a,b)=>b-a);

  listEl.innerHTML = years.map(year => `
    <div class="year-group">
      <div class="year-heading"><span>${year}</span><div class="hr"></div></div>
      <div class="doc-cards">
        ${grouped[year].map(d => `
          <button class="doc-card" data-id="${d.id}">
            <span class="carimbo ${d.direcao === "Emitido" ? "carimbo-emitido" : "carimbo-recebido"}">${esc(d.numero)}</span>
            <span class="doc-info">
              <span class="doc-assunto">${esc(d.assunto)}</span>
              <span class="doc-meta"><span class="mono">${fmtDate(d.data)}</span><span>·</span><span>${esc(d.tipo)}</span><span>·</span><span>${esc(d.entidade)}</span></span>
              <span class="tag-dept">${esc(d.departamento)}</span>
            </span>
          </button>`).join("")}
      </div>
    </div>`).join("");

  listEl.querySelectorAll(".doc-card").forEach(card => {
    card.addEventListener("click", () => {
      const doc = state.docs.find(d => d.id === card.dataset.id);
      if (doc) openViewModal(doc);
    });
  });
}

  document.body.appendChild(overlay);

      overlay.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      dirInput.value = btn.dataset.dir;

      entidadeLabel.firstChild.textContent = isRecebido ? "Remetente (entidade)" : "Destinatário";

  overlay.querySelector("#closeForm").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });

        notas: fd.get("notas"),

      overlay.remove();
    } catch (err) {

      errBox.style.display = "flex";
      btn.disabled = false; btn.textContent = "Registar e carimbar";
    }
  });
}

/* ===================== MODAL: VIEW DOCUMENT ===================== */
async function openViewModal(doc) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-panel">
      <div class="modal-head"><h2>Documento</h2><button class="icon-btn" id="closeView">✕</button></div>
      <div style="padding:20px" id="viewBody"><div class="loading-row">A carregar...</div></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#closeView").addEventListener("click", () => overlay.remove());
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });

  const body = overlay.querySelector("#viewBody");
  let signedUrl = "";
  try {
    signedUrl = doc.ficheiro_path ? await getSignedUrl(doc.ficheiro_path) : "";
  } catch (e) {
    body.innerHTML = `<p class="error-box" style="display:flex">Não foi possível carregar o ficheiro.</p>`;
    return;
  }

  const isImage = (doc.ficheiro_tipo || "").startsWith("image/");
  const isPdf = doc.ficheiro_tipo === "application/pdf";

  body.innerHTML = `
    <span class="carimbo ${doc.direcao === "Emitido" ? "carimbo-emitido" : "carimbo-recebido"}" style="display:inline-block;margin-bottom:10px">${esc(doc.numero)}</span>
    <p class="doc-title">${esc(doc.assunto)}</p>
    <div class="detail-grid">
      <div><span class="muted">Tipo</span><br>${esc(doc.tipo)}</div>
      <div><span class="muted">Data</span><br><span class="mono">${fmtDate(doc.data)}</span></div>
      <div><span class="muted">${doc.direcao === "Emitido" ? "Destinatário" : "Remetente"}</span><br>${esc(doc.entidade)}</div>
      <div><span class="muted">Departamento</span><br>${esc(doc.departamento)}</div>
      ${doc.referencia_entidade ? `<div style="grid-column:1/-1"><span class="muted">Referência da entidade</span><br>${esc(doc.referencia_entidade)}</div>` : ""}
      ${doc.notas ? `<div style="grid-column:1/-1"><span class="muted">Notas</span><br>${esc(doc.notas)}</div>` : ""}
    </div>
    <div class="preview-box">
      ${isImage ? `<img src="${signedUrl}" alt="${esc(doc.ficheiro_nome)}" />`
        : isPdf ? `<iframe src="${signedUrl}" title="preview"></iframe>`
        : `<div class="file-fallback">${esc(doc.ficheiro_nome || "Ficheiro")}</div>`}
    </div>
    <div class="action-row">
      <a href="${signedUrl}" download="${esc(doc.ficheiro_nome||"")}" class="btn-primary" style="flex:1;text-align:center;text-decoration:none">⬇ Transferir</a>
      <button id="deleteBtn" class="btn-danger">🗑</button>
    </div>`;

  body.querySelector("#deleteBtn").addEventListener("click", async () => {
    if (!confirm("Remover este documento do registo? Esta ação não pode ser desfeita.")) return;
    await deleteDocument(doc);
    overlay.remove();
  });
}
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  --ink:#211B14; --ink-soft:#5A5040; --paper:#E9E2CF; --paper-raised:#F8F4E8;
  --rule:#C7BEA0; --green:#2F5233; --green-tint:#E1E7D9; --red:#A83C2E; --red-tint:#F2DFD7;
}

.main{max-width:880px;margin:0 auto;padding:20px 16px}

.btn-ghost:hover{background:var(--paper)}
.btn-danger{border:1px solid var(--red);color:var(--red);background:transparent;border-radius:6px;padding:10px 16px;cursor:pointer;font-size:15px}

.year-heading span{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--ink-soft)}
.hr{flex:1;border-top:1px solid var(--rule)}
.doc-cards{display:flex;flex-direction:column;gap:8px}
.doc-card{display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--paper-raised);border:1px solid var(--rule);border-radius:8px;padding:12px;cursor:pointer;font-family:inherit;width:100%}

.carimbo{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;letter-spacing:.06em;padding:4px 9px;border:1.5px solid currentColor;border-radius:3px;white-space:nowrap;transform:rotate(-1.4deg);position:relative;flex-shrink:0}

.stack input:focus, .stack select:focus, .stack textarea:focus{outline:2px solid var(--green);outline-offset:1px}

.doc-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0 0 12px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper-raised);font-size:13px;padding:10px 18px;border-radius:6px;opacity:0;transition:.3s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:480px){.detail-grid{grid-template-columns:1fr}}
</style>
</body>
