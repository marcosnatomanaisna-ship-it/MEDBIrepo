<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquivo AAFM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#324467;
    --parchment:#F6F1E4;
    --parchment-2:#EFE7D3;
    --red:#B4332C;
    --green:#2F5233;
    --gold:#B08D57;
    --charcoal:#2B2B2B;
    --line:#D9CFB6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--charcoal);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.brand,.doc-title{ font-family:'Fraunces',serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ---------- LOGIN ---------- */
  #tela-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .cartao-login{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:40px 36px;
    max-width:380px;
    width:100%;
    box-shadow:0 2px 24px rgba(27,42,74,0.08);
    position:relative;
  }
  .selo{
    width:56px;height:56px;border-radius:50%;
    border:2px solid var(--red);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:22px;
    color:var(--red);
    transform:rotate(-6deg);
    margin:0 auto 18px;
  }
  .cartao-login h1{ font-size:22px; text-align:center; margin:0 0 4px; color:var(--ink);}
  .cartao-login p.sub{ text-align:center; color:#7a7160; font-size:13px; margin:0 0 28px;}
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:14px 0 5px; text-transform:uppercase; letter-spacing:.04em;}
  input,select,textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:3px; font-family:'Inter',sans-serif; font-size:14px;
    background:#fffdf9;
  }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  button{
    cursor:pointer; border:none; border-radius:3px; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14px;
  }
  .btn-primario{
    background:var(--ink); color:#fff; padding:11px 18px; width:100%; margin-top:20px;
  }
  .btn-primario:hover{ background:var(--ink-soft); }
  .link-alt{ text-align:center; margin-top:16px; font-size:13px; }
  .link-alt a{ color:var(--red); cursor:pointer; text-decoration:none; }
  .erro{ color:var(--red); font-size:13px; margin-top:10px; text-align:center; }

  /* ---------- APP ---------- */
  #app{ display:none; min-height:100vh; }
  .cabecalho{
    background:var(--ink); color:#fff;
    padding:16px 28px; display:flex; align-items:center; justify-content:space-between;
  }
  .cabecalho .brand{ font-size:19px; display:flex; align-items:center; gap:10px; }
  .cabecalho .brand .selo-mini{
    width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gold);
    transform:rotate(-8deg);
  }
  .cabecalho .utilizador{ font-size:13px; opacity:.85; display:flex; align-items:center; gap:14px; }
  .cabecalho .utilizador button{ background:transparent; color:#fff; border:1px solid rgba(255,255,255,.3); padding:6px 12px; border-radius:3px; font-size:12px;}

  .corpo{ display:flex; max-width:1180px; margin:0 auto; }
  .lateral{
    width:220px; padding:24px 18px; border-right:1px solid var(--line);
    flex-shrink:0;
  }
  .lateral h3{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#7a7160; margin:18px 0 8px;}
  .lateral h3:first-child{ margin-top:0; }
  .filtro-tipo{ display:block; width:100%; text-align:left; background:none; padding:6px 8px; border-radius:3px; font-size:13px; color:var(--charcoal); margin-bottom:2px;}
  .filtro-tipo:hover{ background:var(--parchment-2); }
  .filtro-tipo.ativo{ background:var(--ink); color:#fff; }

  .principal{ flex:1; padding:24px 28px; min-width:0; }
  .barra-topo{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
  .barra-topo input[type=text]{ max-width:260px; }
  .btn-novo{ background:var(--red); color:#fff; padding:9px 16px; white-space:nowrap; }
  .btn-novo:hover{ background:#9c2a24; }

  .linha-doc{
    background:#fffdf9; border:1px solid var(--line); border-left:4px solid var(--ink);
    border-radius:3px; padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; gap:16px; cursor:pointer;
  }
  .linha-doc:hover{ box-shadow:0 2px 10px rgba(27,42,74,0.08); }
  .linha-doc .ref{ font-size:12px; color:var(--gold); white-space:nowrap; }
  .linha-doc .assunto{ flex:1; min-width:0; }
  .linha-doc .assunto strong{ display:block; font-size:14.5px; }
  .linha-doc .assunto span{ font-size:12px; color:#8a8272; }
  .badge{ font-size:11px; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
  .badge.rascunho{ background:#EFE3C8; color:#8a6d1f; }
  .badge.enviado{ background:#DDE7E0; color:var(--green); }
  .badge.arquivado{ background:#E3E8F0; color:var(--ink); }

  .vazio{ text-align:center; padding:60px 20px; color:#9a9384; }

  /* ---------- MODAL ---------- */
  .sobreposicao{ display:none; position:fixed; inset:0; background:rgba(27,42,74,.45); z-index:50; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto;}
  .modal{ background:#fff; max-width:640px; width:100%; border-radius:4px; padding:32px; }
  .modal h2{ margin:0 0 18px; font-size:20px; color:var(--ink); }
  .linha-form{ display:flex; gap:12px; }
  .linha-form > div{ flex:1; }
  .acoes-modal{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .btn-secundario{ background:var(--parchment-2); color:var(--charcoal); padding:10px 16px; }
  textarea{ min-height:120px; resize:vertical; font-family:'Inter',sans-serif; }

  /* ---------- VISUALIZAÇÃO ---------- */
  .doc-preview{ background:#fffdf9; border:1px solid var(--line); padding:26px; margin-top:8px; }
  .doc-preview .ref{ font-size:12px; color:var(--gold); margin-bottom:4px; }
  .doc-preview .doc-title{ font-size:20px; color:var(--ink); margin:0 0 14px; }
  .doc-preview .meta{ font-size:12.5px; color:#7a7160; margin-bottom:16px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .doc-preview .corpo-texto{ white-space:pre-wrap; line-height:1.6; font-size:14.5px; }

  @media(max-width:760px){
    .corpo{ flex-direction:column; }
    .lateral{ width:100%; border-right:none; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:4px; padding:14px 18px;}
    .lateral h3{ display:none; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="tela-login">
  <div class="cartao-login">
    <div class="selo">AAFM</div>
    <h1>Arquivo da Secretaria</h1>
    <p class="sub">Associação Académica de Faculdade de Medicina</p>
    <form id="form-login">
      <label>Email</label>
      <input type="email" id="login-email" required placeholder="nome@exemplo.com">
      <label>Senha</label>
      <input type="password" id="login-senha" required placeholder="••••••••">
      <button type="submit" class="btn-primario">Entrar</button>
      <div class="erro" id="login-erro"></div>
    </form>
    <div class="link-alt">
      Ainda não tens conta? <a id="mostrar-registo">Criar conta</a>
    </div>
  </div>
</div>

<!-- ============ REGISTO ============ -->
<div id="tela-registo" style="display:none;" class="cartao-login-wrap">
  <div id="tela-registo-inner"></div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="cabecalho">
    <div class="brand"><span class="selo-mini">AAFM</span> Arquivo de Documentos</div>
    <div class="utilizador">
      <span id="nome-utilizador"></span>
      <button id="btn-sair">Sair</button>
    </div>
  </div>
  <div class="corpo">
    <div class="lateral">
      <h3>Tipo</h3>
      <div id="lista-filtros-tipo"></div>
      <h3>Estado</h3>
      <button class="filtro-tipo ativo" data-estado="todos">Todos</button>
      <button class="filtro-tipo" data-estado="rascunho">Rascunho</button>
      <button class="filtro-tipo" data-estado="enviado">Enviado</button>
      <button class="filtro-tipo" data-estado="arquivado">Arquivado</button>
    </div>
    <div class="principal">
      <div class="barra-topo">
        <input type="text" id="pesquisa" placeholder="Pesquisar por assunto, destinatário ou nº...">
        <button class="btn-novo" id="btn-novo-doc" style="display:none;">+ Novo Documento</button>
      </div>
      <div id="lista-documentos"></div>
    </div>
  </div>
</div>

<!-- ============ MODAL NOVO/EDITAR ============ -->
<div class="sobreposicao" id="modal-doc">
  <div class="modal">
    <h2 id="modal-titulo">Novo documento</h2>
    <form id="form-doc">
      <label>Tipo de documento</label>
      <select id="doc-tipo" required></select>
      <div class="linha-form">
        <div><label>Data</label><input type="date" id="doc-data" required></div>
        <div><label>Estado</label>
          <select id="doc-estado">
            <option value="rascunho">Rascunho</option>
            <option value="enviado">Enviado</option>
            <option value="arquivado">Arquivado</option>
          </select>
        </div>
      </div>
      <label>Assunto</label>
      <input type="text" id="doc-assunto" required placeholder="Ex: Convocatória para Assembleia Geral">
      <label>Destinatário / Remetente</label>
      <input type="text" id="doc-destinatario" placeholder="Ex: Direção da Faculdade de Medicina">
      <label>Corpo do texto</label>
      <textarea id="doc-corpo" placeholder="Conteúdo do documento..."></textarea>
      <div class="acoes-modal">
        <button type="button" class="btn-secundario" id="btn-cancelar-doc">Cancelar</button>
        <button type="submit" class="btn-primario" style="width:auto;">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ MODAL VISUALIZAÇÃO ============ -->
<div class="sobreposicao" id="modal-ver">
  <div class="modal">
    <div id="ver-conteudo"></div>
    <div class="acoes-modal">
      <button type="button" class="btn-secundario" id="btn-fechar-ver">Fechar</button>
      <button type="button" class="btn-secundario" id="btn-editar-ver" style="display:none;">Editar</button>
      <button type="button" class="btn-primario" style="width:auto;" id="btn-pdf-ver">Exportar PDF</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO SUPABASE — preencher com os teus dados
   ========================================================= */
const SUPABASE_URL = 'https://wulmhubjxwrolcsrxpjc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1bG1odWJqeHdyb2xjc3J4cGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjQ4MjgsImV4cCI6MjEwMTI0MDgyOH0.XtAzSjTvuFCxGYLtCeaVMRmCsjOt2mHsp3h9c4MM1_s';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TIPOS = [
  {v:'ata', l:'Ata'},
  {v:'carta', l:'Carta'},
  {v:'oficio', l:'Ofício'},
  {v:'circular', l:'Circular'},
  {v:'convocatoria', l:'Convocatória'},
  {v:'memorando', l:'Memorando'},
  {v:'declaracao', l:'Declaração'},
  {v:'relatorio', l:'Relatório'},
  {v:'edital', l:'Edital'},
  {v:'requerimento', l:'Requerimento'},
  {v:'termo_posse', l:'Termo de Posse'},
  {v:'estatuto', l:'Estatuto'}
];
const rotuloTipo = t => (TIPOS.find(x=>x.v===t)||{}).l || t;

let PERFIL = null;
let DOCUMENTOS = [];
let FILTRO_TIPO = 'todos';
let FILTRO_ESTADO = 'todos';
let DOC_EM_EDICAO = null;
let DOC_VISUALIZADO = null;

/* ---------- INICIALIZAÇÃO ---------- */
document.getElementById('doc-tipo').innerHTML = TIPOS.map(t=>`<option value="${t.v}">${t.l}</option>`).join('');
document.getElementById('lista-filtros-tipo').innerHTML =
  `<button class="filtro-tipo ativo" data-tipo="todos">Todos os tipos</button>` +
  TIPOS.map(t=>`<button class="filtro-tipo" data-tipo="${t.v}">${t.l}</button>`).join('');

async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await entrarNaApp(session.user); }
}
iniciar();

/* ---------- LOGIN ---------- */
document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  const erroEl = document.getElementById('login-erro');
  erroEl.textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){ erroEl.textContent = 'Email ou senha incorretos.'; return; }
  await entrarNaApp(data.user);
});

document.getElementById('mostrar-registo').addEventListener('click', renderizarRegisto);

function renderizarRegisto(){
  document.getElementById('tela-login').style.display='none';
  const wrap = document.getElementById('tela-registo');
  wrap.style.display='flex';
  wrap.style.cssText='min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;';
  document.getElementById('tela-registo-inner').innerHTML = `
    <div class="cartao-login">
      <div class="selo">AAFM</div>
      <h1>Criar conta</h1>
      <p class="sub">Acesso ao arquivo da secretaria</p>
      <form id="form-registo">
        <label>Nome completo</label>
        <input type="text" id="reg-nome" required>
        <label>Email</label>
        <input type="email" id="reg-email" required>
        <label>Senha</label>
        <input type="password" id="reg-senha" required minlength="6">
        <button type="submit" class="btn-primario">Criar conta</button>
        <div class="erro" id="reg-erro"></div>
      </form>
      <div class="link-alt"><a id="voltar-login">Já tenho conta</a></div>
    </div>`;
  document.getElementById('voltar-login').addEventListener('click', ()=>{
    wrap.style.display='none';
    document.getElementById('tela-login').style.display='flex';
  });
  document.getElementById('form-registo').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const nome = document.getElementById('reg-nome').value;
    const email = document.getElementById('reg-email').value;
    const senha = document.getElementById('reg-senha').value;
    const erroEl = document.getElementById('reg-erro');
    const { data, error } = await sb.auth.signUp({
      email, password: senha, options:{ data:{ nome } }
    });
    if(error){ erroEl.textContent = error.message; return; }
    if(data.user){ await entrarNaApp(data.user); }
  });
}

document.getElementById('btn-sair').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  location.reload();
});

/* ---------- ENTRAR NA APP ---------- */
async function entrarNaApp(user){
  document.getElementById('tela-login').style.display='none';
  document.getElementById('tela-registo').style.display='none';

  let { data: perfil } = await sb.from('perfis').select('*').eq('id', user.id).single();
  PERFIL = perfil || { nome: user.email, papel: 'membro' };

  document.getElementById('app').style.display='block';
  document.getElementById('nome-utilizador').textContent = `${PERFIL.nome} · ${rotuloPapel(PERFIL.papel)}`;
  document.getElementById('btn-novo-doc').style.display = PERFIL.papel === 'secretario' ? 'inline-block' : 'none';

  await carregarDocumentos();
}

function rotuloPapel(p){
  return { secretario:'Secretário', direcao:'Direção', membro:'Membro' }[p] || p;
}

/* ---------- CARREGAR / RENDERIZAR DOCUMENTOS ---------- */
async function carregarDocumentos(){
  const { data, error } = await sb.from('documentos').select('*').order('criado_em', { ascending:false });
  if(error){ console.error(error); return; }
  DOCUMENTOS = data || [];
  renderizarLista();
}

function renderizarLista(){
  const termo = document.getElementById('pesquisa').value.toLowerCase();
  let lista = DOCUMENTOS.filter(d=>{
    if(FILTRO_TIPO !== 'todos' && d.tipo !== FILTRO_TIPO) return false;
    if(FILTRO_ESTADO !== 'todos' && d.estado !== FILTRO_ESTADO) return false;
    if(termo){
      const alvo = `${d.assunto} ${d.destinatario||''} ${d.numero_referencia}`.toLowerCase();
      if(!alvo.includes(termo)) return false;
    }
    return true;
  });

  const cont = document.getElementById('lista-documentos');
  if(lista.length===0){
    cont.innerHTML = `<div class="vazio">Nenhum documento encontrado.</div>`;
    return;
  }
  cont.innerHTML = lista.map(d=>`
    <div class="linha-doc" data-id="${d.id}">
      <div class="ref mono">${d.numero_referencia}</div>
      <div class="assunto">
        <strong>${escaparHtml(d.assunto)}</strong>
        <span>${d.destinatario ? escaparHtml(d.destinatario)+' · ' : ''}${formatarData(d.data)}</span>
      </div>
      <span class="badge ${d.estado}">${d.estado}</span>
    </div>
  `).join('');

  document.querySelectorAll('.linha-doc').forEach(el=>{
    el.addEventListener('click', ()=> visualizarDocumento(el.dataset.id));
  });
}

document.getElementById('pesquisa').addEventListener('input', renderizarLista);

document.querySelectorAll('#lista-filtros-tipo .filtro-tipo').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#lista-filtros-tipo .filtro-tipo').forEach(b=>b.classList.remove('ativo'));
    btn.classList.add('ativo');
    FILTRO_TIPO = btn.dataset.tipo;
    renderizarLista();
  });
});
document.querySelectorAll('.lateral [data-estado]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.lateral [data-estado]').forEach(b=>b.classList.remove('ativo'));
    btn.classList.add('ativo');
    FILTRO_ESTADO = btn.dataset.estado;
    renderizarLista();
  });
});

/* ---------- NOVO / EDITAR DOCUMENTO ---------- */
document.getElementById('btn-novo-doc').addEventListener('click', ()=>{
  DOC_EM_EDICAO = null;
  document.getElementById('modal-titulo').textContent = 'Novo documento';
  document.getElementById('form-doc').reset();
  document.getElementById('doc-data').value = new Date().toISOString().slice(0,10);
  document.getElementById('modal-doc').style.display='flex';
});

document.getElementById('btn-cancelar-doc').addEventListener('click', ()=>{
  document.getElementById('modal-doc').style.display='none';
});

document.getElementById('form-doc').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const registo = {
    tipo: document.getElementById('doc-tipo').value,
    data: document.getElementById('doc-data').value,
    estado: document.getElementById('doc-estado').value,
    assunto: document.getElementById('doc-assunto').value,
    destinatario: document.getElementById('doc-destinatario').value,
    corpo: document.getElementById('doc-corpo').value,
  };

  if(DOC_EM_EDICAO){
    const { error } = await sb.from('documentos').update(registo).eq('id', DOC_EM_EDICAO);
    if(error){ alert('Erro ao atualizar: ' + error.message); return; }
  } else {
    registo.ano = new Date(registo.data).getFullYear();
    registo.criado_por = PERFIL.id;
    const { error } = await sb.from('documentos').insert(registo);
    if(error){ alert('Erro ao criar: ' + error.message); return; }
  }
  document.getElementById('modal-doc').style.display='none';
  await carregarDocumentos();
});

/* ---------- VISUALIZAR DOCUMENTO ---------- */
function visualizarDocumento(id){
  const d = DOCUMENTOS.find(x=>x.id===id);
  if(!d) return;
  DOC_VISUALIZADO = d;
  document.getElementById('ver-conteudo').innerHTML = `
    <div class="doc-preview">
      <div class="ref mono">${d.numero_referencia}</div>
      <div class="doc-title">${escaparHtml(d.assunto)}</div>
      <div class="meta">
        ${d.destinatario ? `Para: ${escaparHtml(d.destinatario)} · ` : ''}${formatarData(d.data)} ·
        <span class="badge ${d.estado}">${d.estado}</span>
      </div>
      <div class="corpo-texto">${escaparHtml(d.corpo || '(sem conteúdo)')}</div>
    </div>`;
  document.getElementById('btn-editar-ver').style.display = PERFIL.papel==='secretario' ? 'inline-block' : 'none';
  document.getElementById('modal-ver').style.display='flex';
}

document.getElementById('btn-fechar-ver').addEventListener('click', ()=>{
  document.getElementById('modal-ver').style.display='none';
});

document.getElementById('btn-editar-ver').addEventListener('click', ()=>{
  const d = DOC_VISUALIZADO;
  DOC_EM_EDICAO = d.id;
  document.getElementById('modal-titulo').textContent = 'Editar documento';
  document.getElementById('doc-tipo').value = d.tipo;
  document.getElementById('doc-data').value = d.data;
  document.getElementById('doc-estado').value = d.estado;
  document.getElementById('doc-assunto').value = d.assunto;
  document.getElementById('doc-destinatario').value = d.destinatario || '';
  document.getElementById('doc-corpo').value = d.corpo || '';
  document.getElementById('modal-ver').style.display='none';
  document.getElementById('modal-doc').style.display='flex';
});

/* ---------- EXPORTAR PDF ---------- */
document.getElementById('btn-pdf-ver').addEventListener('click', ()=>{
  const d = DOC_VISUALIZADO;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('ASSOCIAÇÃO ACADÉMICA DE FACULDADE DE MEDICINA (AAFM)', 20, 20);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(d.numero_referencia, 20, 28);
  doc.line(20, 32, 190, 32);
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(d.assunto, 20, 44);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  let y = 54;
  if(d.destinatario){ doc.text(`Para: ${d.destinatario}`, 20, y); y+=7; }
  doc.text(`Data: ${formatarData(d.data)}`, 20, y); y+=12;
  doc.setFontSize(11);
  const linhas = doc.splitTextToSize(d.corpo || '', 170);
  doc.text(linhas, 20, y);
  doc.save(`${d.numero_referencia.replace(/[\/ ]/g,'_')}.pdf`);
});

/* ---------- UTILITÁRIOS ---------- */
function escaparHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatarData(iso){
  if(!iso) return '';
  const [a,m,d] = iso.split('-');
  return `${d}/${m}/${a}`;
}
</script>
