<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico AAFM</title>
</head>
<body style="font-family:sans-serif;padding:16px;font-size:14px;line-height:1.6;background:#fff;color:#111">
<h2>Diagnóstico</h2>
<div id="log">A iniciar...</div>

<script>
const log = document.getElementById('log');
function add(msg, color) {
  const p = document.createElement('div');
  p.style.padding = '8px';
  p.style.margin = '6px 0';
  p.style.borderRadius = '6px';
  p.style.background = color || '#eee';
  p.textContent = msg;
  log.appendChild(p);
}

log.innerHTML = '';
add('1) JavaScript básico está a correr. ✅', '#d4edda');

fetch('https://thzzferulfjtlhvnefuy.supabase.co/rest/v1/', {
  headers: { apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoenpmZXJ1bGZqdGxodm5lZnV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MTkyMjUsImV4cCI6MjEwMTE5NTIyNX0.c_7S5LupUpACoYqXHd5tS8ytc0XEQ9eZLGBs87rmagM' }
}).then(r => {
  add('2) Resposta recebida do Supabase REST. Status: ' + r.status + ' ✅', '#d4edda');
  return r.text();
}).then(t => {
  add('3) Corpo da resposta: ' + t.slice(0, 200), '#eee');
}).catch(e => {
  add('2) ERRO ao contactar Supabase: ' + e.message, '#f8d7da');
});

const script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
script.onload = () => add('4) Biblioteca supabase-js (CDN) carregou. ✅', '#d4edda');
script.onerror = () => add('4) ERRO: biblioteca supabase-js (CDN) NÃO carregou. ❌', '#f8d7da');
document.head.appendChild(script);

setTimeout(() => add('5) Passaram 5 segundos e este script continua vivo. ✅', '#d4edda'), 5000);
</script>
</body>
</html>
